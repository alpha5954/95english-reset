<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>啾呜英语 · 重置密码</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','PingFang SC','Microsoft YaHei',sans-serif;
    background:#F5F3F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:#fff;border-radius:24px;padding:32px 24px;width:100%;max-width:380px;
    box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center;
  }
  h1{font-size:1.3rem;color:#333;margin-bottom:4px}
  .sub{font-size:.82rem;color:#999;margin-bottom:20px}
  .error{display:none;font-size:.8rem;color:#E1524B;background:#FDE8E8;padding:10px 14px;border-radius:10px;margin-bottom:14px;text-align:left}
  .success{display:none;font-size:.85rem;color:#34C759;background:#E8F9ED;padding:12px 14px;border-radius:10px;margin-bottom:14px;text-align:center}
  .hint{display:none;font-size:.8rem;color:#F5A623;padding:8px 0;text-align:left}
  input{
    width:100%;padding:14px 16px;border:1.5px solid #E0DEE8;border-radius:14px;font-size:1rem;
    outline:none;transition:border-color .15s;margin-bottom:12px;
  }
  input:focus{border-color:#5856D6}
  .btn{
    width:100%;padding:14px;background:#5856D6;color:#fff;border:none;border-radius:14px;
    font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .15s
  }
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .footer{margin-top:18px;font-size:.72rem;color:#bbb}
</style>
</head>
<body>
<div class="card">
  <h1>重置密码</h1>
  <p class="sub">啾呜英语 · 95-English</p>

  <div id="errorEl" class="error"></div>
  <div id="successEl" class="success">✅ 密码已重置！<br>请回到 App 用新密码登录。</div>
  <div id="hint" class="hint">密码要求：至少 8 位，必须包含字母和数字</div>

  <input type="password" id="password" placeholder="新密码（至少8位字母+数字）" autocomplete="new-password">
  <input type="password" id="confirm" placeholder="确认新密码" autocomplete="new-password">
  <button class="btn" id="submitBtn">重置密码</button>
  <div class="footer">95-English © 2026</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://xeheoiztpmnljdsfljme.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlaGVvaXp0cG1ubGpkc2Zsam1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjE1NjMsImV4cCI6MjEwMTQzNzU2M30.cvO1UwmYO_k8Dqs4vDHqgLwdkK199IMEIQGfcLKM9CU';
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Parse tokens from URL hash
  var hash = window.location.hash ? window.location.hash.substring(1) : '';
  var params = {};
  if (hash) {
    hash.split('&').forEach(function(p) {
      var idx = p.indexOf('=');
      if (idx >= 0) params[p.substring(0, idx)] = decodeURIComponent(p.substring(idx + 1));
    });
  }

  var errorEl = document.getElementById('errorEl');
  var btn = document.getElementById('submitBtn');

  if (!params.access_token) {
    errorEl.style.display = '';
    errorEl.textContent = '链接无效，请重新在 App 中申请重置密码。';
    btn.style.display = 'none';
    return;
  }

  // Set session from recovery tokens
  supabase.auth.setSession({
    access_token: params.access_token,
    refresh_token: params.refresh_token || ''
  }).then(function(res) {
    if (res.error) {
      errorEl.style.display = '';
      errorEl.textContent = '会话已过期，请重新申请重置密码。';
      btn.style.display = 'none';
    }
  });

  // Wire up button
  btn.addEventListener('click', async function() {
    var pw = document.getElementById('password').value;
    var cf = document.getElementById('confirm').value;
    var hint = document.getElementById('hint');

    if (!pw) { errorEl.textContent = '请输入新密码'; errorEl.style.display = ''; return; }
    if (pw.length < 8) { errorEl.textContent = '密码至少需要 8 位'; errorEl.style.display = ''; hint.style.display = ''; return; }
    if (!/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw)) { errorEl.textContent = '密码必须包含字母和数字'; errorEl.style.display = ''; hint.style.display = ''; return; }
    if (pw !== cf) { errorEl.textContent = '两次密码输入不一致'; errorEl.style.display = ''; return; }

    errorEl.style.display = 'none';
    hint.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '正在更新...';

    var r = await supabase.auth.updateUser({ password: pw });
    if (r.error) {
      errorEl.textContent = '更新失败：' + (r.error.message || '请重试');
      errorEl.style.display = '';
      btn.disabled = false;
      btn.textContent = '重置密码';
    } else {
      document.getElementById('successEl').style.display = '';
      document.getElementById('password').style.display = 'none';
      document.getElementById('confirm').style.display = 'none';
      btn.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
