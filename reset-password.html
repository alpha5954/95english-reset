<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>啾呜英语 · 重置密码</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','PingFang SC','Microsoft YaHei',sans-serif;
    background:#F5F3F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:#fff;border-radius:24px;padding:32px 24px;width:100%;max-width:380px;
    box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center;
  }
  h1{font-size:1.3rem;color:#333;margin-bottom:4px}
  .sub{font-size:.82rem;color:#999;margin-bottom:20px}
  .error{display:none;font-size:.8rem;color:#E1524B;background:#FDE8E8;padding:10px 14px;border-radius:10px;margin-bottom:14px;text-align:left}
  .success{display:none;font-size:.85rem;color:#34C759;background:#E8F9ED;padding:16px 14px;border-radius:10px;margin-bottom:14px;text-align:center}
  input{
    width:100%;padding:14px 16px;border:1.5px solid #E0DEE8;border-radius:14px;font-size:1rem;
    outline:none;transition:border-color .15s;margin-bottom:12px;
  }
  input:focus{border-color:#5856D6}
  .btn{
    width:100%;padding:14px;background:#5856D6;color:#fff;border:none;border-radius:14px;
    font-size:1rem;font-weight:600;cursor:pointer;
  }
  .btn:active{opacity:.8}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .footer{margin-top:18px;font-size:.72rem;color:#bbb}
</style>
</head>
<body>
<div class="card">
  <h1>重置密码</h1>
  <p class="sub">啾呜英语 · 95-English</p> 

  <div id="errorEl" class="error"></div>
  <div id="successEl" class="success">密码已重置！请回到 App 用新密码登录。</div>

  <input type="password" id="password" placeholder="新密码（至少8位字母+数字）" autocomplete="new-password">
  <input type="password" id="confirm" placeholder="确认新密码" autocomplete="new-password">
  <button class="btn" id="submitBtn">重置密码</button>
  <div class="footer">95-English © 2026</div>
</div>

<script>
(function(){
  var SUPABASE_URL = 'https://xeheoiztpmnljdsfljme.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlaGVvaXp0cG1ubGpkc2Zsam1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NjE1NjMsImV4cCI6MjEwMTQzNzU2M30.cvO1UwmYO_k8Dqs4vDHqgLwdkK199IMEIQGfcLKM9CU';

  var errorEl = document.getElementById('errorEl');
  var successEl = document.getElementById('successEl');
  var btn = document.getElementById('submitBtn');
  var pwInput = document.getElementById('password');
  var cfInput = document.getElementById('confirm');

  // Parse tokens — Supabase puts them in URL hash after redirectTo
  var raw = window.location.hash ? window.location.hash.substring(1) : '';
  var params = {};
  raw.split('&').forEach(function(p) {
    var idx = p.indexOf('=');
    if (idx >= 0) params[decodeURIComponent(p.substring(0, idx))] = decodeURIComponent(p.substring(idx + 1));
  });

  if (!params.access_token) {
    errorEl.style.display = '';
    errorEl.textContent = '链接无效或已过期，请重新在 App 中申请重置密码。';
    btn.style.display = 'none';
    pwInput.style.display = 'none';
    cfInput.style.display = 'none';
    return;
  }

  // Wiring — using plain fetch, no external CDN dependency
  btn.addEventListener('click', function() {
    var pw = pwInput.value;
    var cf = cfInput.value;

    if (!pw) { errorEl.style.display = ''; errorEl.textContent = '请输入新密码'; return; }
    if (pw.length < 8) { errorEl.style.display = ''; errorEl.textContent = '密码至少需要 8 位'; return; }
    if (!/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw)) { errorEl.style.display = ''; errorEl.textContent = '密码必须包含字母和数字'; return; }
    if (pw !== cf) { errorEl.style.display = ''; errorEl.textContent = '两次密码输入不一致'; return; }

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '正在更新...';

    fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + params.access_token
      },
      body: JSON.stringify({ password: pw })
    }).then(function(res) {
      if (!res.ok) return res.json().then(function(e) { throw new Error(e.message || e.msg || 'HTTP ' + res.status); });
      successEl.style.display = '';
      pwInput.style.display = 'none';
      cfInput.style.display = 'none';
      btn.style.display = 'none';
    }).catch(function(e) {
      errorEl.style.display = '';
      errorEl.textContent = '更新失败：' + (e.message || '请重试或联系作者');
      btn.disabled = false;
      btn.textContent = '重置密码';
    });
  });
})();
</script>
</body>
</html>
